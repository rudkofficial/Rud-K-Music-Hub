<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuzikiUG - Real</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white}
header{background:#ff6600;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.card{background:#1e1e1e;margin:12px;border-radius:12px;padding:12px}
button{background:#ff6600;border:0;color:white;padding:10px 15px;border-radius:8px;font-weight:bold}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0}
audio{width:100%}
</style>
</head>
<body>
<header><h2>MuzikiUG 🇺🇬 REAL</h2><small>70% to Artist • 10% to You</small></header>

<div class="card">
<h3>🎤 Artist Real Upload</h3>
<input id="artistName" placeholder="Your Artist Name">
<input id="songTitle" placeholder="Song Title (e.g. Kipenzi UG)">
<input type="file" id="mp3File" accept="audio/*">
<button onclick="realUpload()">UPLOAD NOW - REAL</button>
<p id="upStatus"></p>
</div>

<div class="card">
<input id="search" placeholder="Search songs..." oninput="renderSongs()">
</div>

<div id="songList"></div>

<script>
let songs = JSON.parse(localStorage.getItem('muziki_songs')||'[{"title":"Kipenzi UG","artist":"Rud-K","url":""}]');

function realUpload(){
 const fileInput = document.getElementById('mp3File');
 const title = document.getElementById('songTitle').value;
 const artist = document.getElementById('artistName').value || 'Rud-K';
 if(!fileInput.files[0] ||!title){ alert('Select MP3 file and Title!'); return; }
 const file = fileInput.files[0];
 const url = URL.createObjectURL(file); // REAL file URL
 songs.unshift({title:title, artist:artist, url:url, fileName:file.name});
 localStorage.setItem('muziki_songs', JSON.stringify(songs.map(s=>({title:s.title,artist:s.artist,url:''}))));
 // Save real file in memory for this session
 window.realFiles = window.realFiles || {};
 window.realFiles[title] = url;
 document.getElementById('upStatus').innerText = '✅ REAL UPLOADED: ' + file.name + ' - Now visible below!';
 renderSongs();
}
function renderSongs(){
 const q = (document.getElementById('search').value||'').toLowerCase();
 const list = document.getElementById('songList');
 list.innerHTML='';
 songs.filter(s=> s.title.toLowerCase().includes(q)).forEach((s,i)=>{
   const realUrl = (window.realFiles && window.realFiles[s.title]) || s.url;
   list.innerHTML+=`<div class="card"><b>${s.title}</b> - ${s.artist}<br>${realUrl?`<audio controls src="${realUrl}"></audio><br><a href="${realUrl}" download><button>Download (500 UGX)</button></a>`:`<small>Demo song - upload real MP3 above to play</small>`}</div>`;
 });
}
renderSongs();
</script>
</body>
</html>
