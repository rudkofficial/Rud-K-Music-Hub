<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MuzikiUG — Stream & Download Ugandan Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen">

  <!-- Header -->
  <header class="p-5 border-b border-neutral-800 flex justify-between items-center max-w-5xl mx-auto">
    <h1 class="text-2xl font-black text-amber-500">MuzikiUG</h1>
    <button onclick="registerMoMo()" class="bg-amber-500 text-neutral-950 font-bold px-4 py-2 rounded-xl text-xs">
      Register (2,000 UGX)
    </button>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl">
      <h2 class="text-xl font-bold text-amber-400 mb-2">Download Top Songs (500 UGX)</h2>
      <p class="text-xs text-neutral-400 mb-6">70% to 90% goes directly to the artist!</p>

      <!-- Song List -->
      <div id="song-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-neutral-950 p-4 border border-neutral-800 rounded-xl flex justify-between items-center">
          <div>
            <h3 class="font-bold">Kipenzi UG</h3>
            <p class="text-xs text-neutral-400">Liam Voice</p>
          </div>
          <button onclick="payDownload('Kipenzi UG')" class="bg-amber-500 text-neutral-950 font-bold px-3 py-1.5 rounded-lg text-xs">
            Download 500 UGX
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function registerMoMo() {
      let phone = prompt("Enter MTN/Airtel Phone Number for 2,000 UGX Registration:");
      if (phone) alert("MoMo prompt sent to " + phone + "! Welcome to MuzikiUG.");
    }

    function payDownload(song) {
      let phone = prompt("Enter MoMo number to pay 500 UGX for " + song + ":");
      if (phone) alert("Payment received! Download started for " + song);
    }
  </script>
</body>
</html>
